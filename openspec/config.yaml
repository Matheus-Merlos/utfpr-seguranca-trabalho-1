schema: spec-driven

context: |
  # SIGAcad — portal acadêmico fictício VULNERÁVEL POR DESIGN

  Laboratório para o Trabalho 1 de Segurança (auditoria OWASP Top 10:2025).
  A aplicação é PROPOSITALMENTE insegura: colegas vão auditá-la, explorar as
  falhas e abrir PRs de correção. Escreva todos os artefatos em português do Brasil.

  ## Domínio
  Perfis: ALUNO, PROFESSOR, ADMIN.
  - Aluno: vê disciplinas em que está matriculado, boletim (notas e faltas),
    busca disciplinas, posta no mural, edita o próprio perfil.
  - Professor: lança e edita notas das turmas dele, posta avisos no mural.
  - Admin: gerencia usuários, disciplinas e matrículas.
  Seed: 1 admin, 3 professores, ~20 alunos, ~8 disciplinas, notas e recados.
  Todos os dados são fictícios.

  ## Stack
  - backend/: NestJS + TypeScript, TypeORM, PostgreSQL. Prefixo global /api.
  - frontend/: Svelte 5 + Vite, SPA estática (build sobe para S3).
  - docker-compose.yml na raiz: postgres + api + front, para dev e reteste local.
    - infra/: Terraform na DigitalOcean: um droplet em VPC própria, firewall
    (80/443 abertos, SSH só do IP do dono) e DNS. No droplet, Caddy com HTTPS
    automático serve o build estático do frontend e faz proxy de /api para o
    backend.

  ## Catálogo de falhas plantadas (gabarito)
  Cada change deve dizer quais VULN implementa. Implementar exatamente assim.

  - VULN-01 [A05 Injection/SQLi] Login monta a query concatenando username e o
    hash da senha (dataSource.query com template string). Payload ' OR '1'='1' --
    no username entra como o primeiro usuário (admin).
  - VULN-02 [A05 Injection/SQLi] GET /api/disciplinas?busca= concatena o termo em
    LIKE '%...%'. Permite UNION e extração com sqlmap.
  - VULN-03 [A05 Injection/XSS armazenado] Mural de recados renderiza o texto com
    {@html} ("para permitir negrito"). Nome de exibição do perfil também.
  - VULN-04 [A05 Injection/XSS DOM] Página de busca mostra "Resultados para: X"
    lendo X da query string e renderizando com {@html}.
  - VULN-05 [A01 Broken Access Control/IDOR] GET /api/alunos/:id/boletim não
    verifica se o usuário autenticado é o dono do boletim.
  - VULN-06 [A01 Broken Access Control] PATCH /api/notas/:id tem só o guard de
    autenticação; falta o @Roles('PROFESSOR'). Aluno consegue alterar a própria nota.
  - VULN-07 [A01 Broken Access Control/mass assignment] PATCH /api/usuarios/me
    aceita o DTO inteiro, incluindo o campo role. Aluno vira ADMIN.
  - VULN-08 [A04 Cryptographic Failures] Senhas armazenadas como MD5 sem sal.
  - VULN-09 [A07 Authentication Failures] JWT HS256 com segredo fraco "segredo123",
    sem expiração. O backend confia no role do payload sem consultar o banco.
  - VULN-10 [A07 Authentication Failures] Login sem rate limit nem bloqueio.
    Mensagens distintas para "usuário não encontrado" e "senha incorreta".
  - VULN-11 [A07 Authentication Failures] Recuperação de senha com token previsível:
    base64(email + ":" + data AAAA-MM-DD). Token não expira nem é invalidado.
  - VULN-12 [A07/A02] JWT guardado em cookie "token" sem HttpOnly, Secure e SameSite
    (encadeia com o XSS para roubo de sessão).
  - VULN-13 [A02 Security Misconfiguration] CORS refletindo qualquer Origin com
    credentials: true.
  - VULN-14 [A02 Security Misconfiguration] Swagger público em /api/docs; seed com
    usuário admin / senha admin; sem helmet (headers de segurança ausentes).
  - VULN-15 [A03 Software Supply Chain Failures] lodash fixado em 4.17.15 (CVEs
    conhecidos) e usado de verdade em algum utilitário. npm audit deve acusar.
  - VULN-16 [A09 Logging & Alerting Failures] Nenhum log de falhas de login,
    alterações de nota ou mudanças de perfil/role.
  - VULN-17 [A10 Mishandling of Exceptional Conditions] Exception filter global
    devolve message, stack e, em erro de banco, a query SQL no corpo da resposta.

  ## Proibido (a aplicação fica exposta na internet)
  Nada de execução remota de código, command injection, upload de arquivo
  executável, SSRF ou deserialização insegura. Nada que dê shell na VM ou acesso
  ao endpoint de metadata da DigitalOcean.

rules:
  proposal:
    - Liste explicitamente quais VULN-XX do catálogo este change implementa
    - Declare o que está fora de escopo
  specs:
    - Cada VULN vira um Requirement com a tag [VULN-XX] no título e pelo menos um Scenario de exploração com payload concreto
    - Requisitos funcionais normais também têm Scenario
  design:
    - Para cada VULN, descreva como ela aparece no código de forma que pareça descuido natural, sem comentários que a denunciem
  tasks:
    - Toda VULN-XX tem uma task de verificação manual (curl ou passo no navegador) provando que a falha funciona
    - Termine cada grupo de tasks com um commit em conventional commits, sem mencionar falhas ou vulnerabilidades na mensagem