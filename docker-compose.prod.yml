services:
  api:
    image: ${DOCKERHUB_USERNAME:-sigacad}/sigacad-api:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-sigacad}
      - DB_PASSWORD=${DB_PASSWORD:-sigacad}
      - DB_NAME=${DB_NAME:-sigacad}
      - JWT_SECRET=${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      - SMTP_HOST=${SMTP_HOST:?Configure o servidor de e-mail}
      - SMTP_FROM=${SMTP_FROM:?Configure o remetente de recuperação}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-sigacad}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sigacad}
      - POSTGRES_DB=${DB_NAME:-sigacad}

volumes:
  pgdata:
